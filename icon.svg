<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0" stop-color="#fff7d6" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff7d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b8b"/><stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="248" r="190" fill="url(#glow)"/>
  <!-- rays -->
  <g stroke="#ffe066" stroke-width="10" stroke-linecap="round" opacity="0.9">
    <line x1="256" y1="70" x2="256" y2="120"/>
    <line x1="256" y1="376" x2="256" y2="426"/>
    <line x1="70" y1="248" x2="120" y2="248"/>
    <line x1="392" y1="248" x2="442" y2="248"/>
    <line x1="123" y1="115" x2="158" y2="150"/>
    <line x1="354" y1="346" x2="389" y2="381"/>
    <line x1="389" y1="115" x2="354" y2="150"/>
    <line x1="158" y1="346" x2="123" y2="381"/>
  </g>
  <!-- sacred heart -->
  <path d="M256 360 C150 286 168 196 224 196 C250 196 256 218 256 218 C256 218 262 196 288 196 C344 196 362 286 256 360 Z"
        fill="url(#heart)" stroke="#9f1239" stroke-width="6"/>
  <!-- flame -->
  <path d="M256 150 C246 176 268 184 256 210 C282 196 280 168 256 150 Z" fill="#ffb703" stroke="#fb8500" stroke-width="3"/>
  <!-- cross over heart -->
  <g fill="#ffffff">
    <rect x="247" y="238" width="18" height="86" rx="6"/>
    <rect x="226" y="262" width="60" height="18" rx="6"/>
  </g>
</svg>
